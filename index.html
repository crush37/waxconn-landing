  <style>
    :root {
      --yellow: #EEBE00;
      --ink: #333333;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--yellow);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
    }

    /* Soft light spots, echoing the OG image */
    .glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 18% 22%, rgba(255, 220, 60, .55) 0 4vmin, transparent 9vmin),
        radial-gradient(circle at 82% 14%, rgba(255, 220, 60, .45) 0 3vmin, transparent 7vmin),
        radial-gradient(circle at 70% 78%, rgba(255, 220, 60, .40) 0 5vmin, transparent 11vmin),
        radial-gradient(circle at 10% 85%, rgba(255, 220, 60, .35) 0 3vmin, transparent 8vmin),
        radial-gradient(ellipse at 50% 45%, rgba(255, 210, 40, .35), transparent 60%);
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    h1 { margin: 0; }

    .logo {
      display: block;
      width: min(82vw, 640px);
      height: auto;
      animation: spin-in .9s cubic-bezier(.2, .8, .2, 1) both;
    }

    .tagline {
      margin: clamp(1rem, 3vw, 1.75rem) 0 0;
      font-size: clamp(1.1rem, 2.6vw, 1.6rem);
      font-weight: 300;
      letter-spacing: .02em;
      animation: fade-up .8s .35s ease-out both;
    }

    .soon {
      margin: .6rem 0 0;
      font-size: clamp(.9rem, 1.8vw, 1rem);
      opacity: .75;
      animation: fade-up .8s .5s ease-out both;
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .5rem 1.5rem;
      font-size: .95rem;
    }

    footer a {
      color: inherit;
      font-weight: 600;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    footer a:hover { text-decoration-thickness: 3px; }

    footer a:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .copy { opacity: .7; }

    /* The record slides in from the left, like the speed lines suggest */
    @keyframes spin-in {
      from { opacity: 0; transform: translateX(-6vw); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo, .tagline, .soon { animation: none; }
    }
  </style>
